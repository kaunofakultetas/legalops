# ---------------------------------------------------------------------------
#  corpus/catalog.yaml — the seed corpus (manage.py seed_corpus)
#
#  The Lithuanian and EU acts a financial-sector compliance review needs,
#  verified on 2026-09-27 against their official machine sources:
#    cellar — EU acts, CELEX → CELLAR (publications.europa.eu), newest
#             consolidated version in force, Lithuanian XHTML
#    etar   — Lithuanian acts, e-tar.lt document id → the edition valid today
#    lb     — Bank of Lithuania pages / PDFs on www.lb.lt
#    upload — nothing is fetched: a person uploads the file on the act's
#             page; source_url says where the text is published
#  applies_to uses the institution types of companies/models.py ("all" =
#  every regulated entity); domains are the screening tags of the analysis.
#  seed_corpus creates the missing acts and queues their ingestion; acts that
#  exist are left alone (the database is the truth after the first seed).
#  CRR and CRD ship disabled: they are very large and written for banks (the
#  CRR for investment firms too) — enable them on the corpus page when such
#  an institution is analysed.
#  Added and verified on 2026-11-12: the level 2 acts of MiCA and DORA that
#  bind a provider's conduct (regulatory and implementing technical
#  standards, each its own CELEX number), the Bank of Lithuania's
#  instructions on money-laundering prevention and on international
#  sanctions, and the EBA's ML/TF risk factor guidelines. The standards that
#  bind only an applicant, a notifying entity or an entity picked for
#  threat-led testing ship disabled, and so do the two that are report and
#  register templates field by field.
#  A level 2 act names the provisions it was adopted under (adopted_under:
#  the parent act's slug and the article numbers of its empowerment). It
#  lays down no sanction of its own, so a finding under it is shown what a
#  breach of those articles of the parent can cost (corpus/sanctions.py).
#  The key is read from this file, not from the database.
# ---------------------------------------------------------------------------
