# The gap analysis (prompt report.gap_analysis), obligation by obligation.
#
# Each case is one obligation of the register as the report of 2026-11-11 put
# it to the model for the sample company (data/1009-ltd), and the status a
# careful reader of the company's 26 documents gives it under the rules of
# the gap-analysis prompt. `accept` names a second status where two readers
# of those rules differ; a case passes on either.
#
# How the labels were made (2026-11-12): 72 findings of that report were
# drawn, spread over the acts and over the model's own statuses. Two
# independent reviewers (Claude, each reading the whole library and the
# rules, half of the cases each) labelled them without the model's answers;
# every quote they relied on was checked word for word. The reviewers could
# see the order the cases were drawn in, which hints at the model's status —
# a flaw of the method: they agreed with the model on 52 cases, named its
# answer as a defensible alternative on 14 and differed outright on 6, so
# neither followed it. Where reviewer and model agreed the label is theirs;
# where the reviewer named the model's status as defensible both are
# accepted; the six outright differences were read against the rules by the
# assistant (Claude) — `adjudicated` — and one was dropped (pai-69: a rule on the burden of proof in a dispute, not a duty a company arranges for in advance).
# Overrule a label by editing it here.
cases:
  - id: adtai-71
    act: "ADTAĮ"
    expect: unknown
    accept: [partial]
    why: >-
      A data-protection duty with no privacy or employee-data documents
      provided: the HR policy only says that background screening is done and
      tailored to the role, without saying whether conviction data are
      processed, on what basis or with which safeguards. Partial is arguable
      because screening is addressed but its limits for conviction data are
      not.
    obligation:
      provisions: "5 str."
      category: data_protection
      title: "Riboti kandidatų ir darbuotojų duomenų apie nusikalstamas veikas tvarkymą"
      text: >-
        Duomenų valdytojas kandidato arba darbuotojo asmens duomenis apie
        apkaltinamuosius nuosprendžius ir nusikalstamas veikas gali tvarkyti
        tik tiek, kiek tai būtina vykdant jam taikomą teisinę prievolę
        patikrinti atitiktį teisės aktuose nustatytiems pareigų ar darbo
        funkcijų reikalavimams arba siekiant teisėtų darbdavio interesų, kurių
        nenusveria duomenų subjekto interesai arba pagrindinės teisės ir
        laisvės, ypač kai duomenų subjektas yra vaikas. Remiantis teisėtais
        darbdavio interesais, turi būti laikomasi Reglamento (ES) 2016/679
        reikalavimų ir 5 straipsnio 2 dalyje nustatytų apsaugos priemonių. Šie
        apribojimai taip pat taikomi asmenims, dirbantiems Užimtumo įstatyme
        nurodytais darbo santykiams prilygintų teisinių santykių pagrindais,
        ir kandidatams dirbti šiais pagrindais.
      addressee: "duomenų valdytojas; darbdavys"
      appliesWhen: "Tvarkomi kandidato ar darbuotojo duomenys apie apkaltinamuosius nuosprendžius ir nusikalstamas veikas."
      expectedEvidence: "Taikomos teisinės prievolės dokumentai arba teisėtų interesų vertinimas; tvarkomų duomenų apimties pagrindimas."
      deadline: ""
