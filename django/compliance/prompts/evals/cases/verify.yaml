  - id: fii-3-no-licence
    act: Lietuvos Respublikos finansų įstaigų įstatymas
    expect: supported
    why: >-
      Paragraph 3 forbids it.
    provision:
      path: 3 str.
      text: |-
        3 straipsnis. Finansinės paslaugos
        1. Finansinės paslaugos yra:
        1) indėlių ir kitų grąžintinų lėšų priėmimas;
        2) skolinimas (įskaitant hipotekines paskolas);
        3) finansinė nuoma (lizingas);
        4) mokėjimo paslaugos;
        5) kelionių čekių, vekselių ir kitų mokėjimo priemonių išdavimas ir administravimas, jei šios veiklos neapima šio straipsnio 1 dalies 4 punkte nurodytos paslaugos;
        6) finansinių laidavimų ir finansinių garantijų teikimas;
        7) sandorių sudarymas savo ar kliento sąskaita dėl pinigų rinkos priemonių (čekių, vekselių, indėlių sertifikatų ir t. t.), užsienio valiutos, finansinių būsimųjų ir pasirinkimo sandorių, valiutos keitimo kurso nustatymo ir palūkanų normos nustatymo priemonių, viešosios apyvartos vertybinių popierių, tauriųjų metalų;
        8) investicinės paslaugos;
        9) finansinis tarpininkavimas (agento veikla);
        10) pinigų tvarkymas;
        11) kreditingumo vertinimo paslaugos;
        12) seifo kamerų nuoma;
        13) valiutos keitimas (grynaisiais pinigais);
        14) atsiskaitymų tarp kredito įstaigų įskaitymas (kliringas);
        15) piniginių lėšų saugojimas ir administravimas;
        16) įmonių konsultavimas dėl kapitalo struktūros, gamybos strategijos ir su tuo susijusių klausimų, taip pat konsultacijos ir paslaugos, susijusios su įmonių reorganizavimu, pertvarkymu ir pirkimu;
        17) su vertybinių popierių emisijomis susijusių paslaugų teikimas;
        18) elektroninių pinigų, įskaitant elektroninių pinigų žetonus, kaip jie apibrėžti 2023 m. gegužės 31 d. Europos Parlamento ir Tarybos reglamente (ES) 2023/1114 dėl kriptoturto rinkų, kuriuo iš dalies keičiami reglamentai (ES) Nr. 1093/2010 bei (ES) Nr. 1095/2010 ir direktyvos 2013/36/ES bei (ES) 2019/1937, 3 straipsnio 1 dalies 7 punkte, leidimas;
        19) investicinių fondų, uždaro tipo investicinių bendrovių, pensijų fondų ar investicinių kintamojo kapitalo bendrovių valdymas;
        20) finansinių priemonių saugojimas, apskaita ir valdymas klientų sąskaita, įskaitant turto saugojimą ir kitas su tuo susijusias paslaugas, tokias kaip pinigų ar finansinio užstato valdymas;
        21) sutelktinio finansavimo paslaugų teikėjo veikla, kaip tai apibrėžta Reglamente (ES) 2020/1503;
        22) tarpusavio skolinimo platformos operatoriaus veikla;
        23) su turtu susietų žetonų, kaip jie apibrėžti Reglamento (ES) 2023/1114 3 straipsnio 1 dalies 6 punkte, leidimas;
        24) kriptoturto paslaugos, kaip jos apibrėžtos Reglamento (ES) 2023/1114 3 straipsnio 1 dalies 16 punkte;
        25) skatinamojo finansavimo veikla, kaip ji apibrėžta Lietuvos Respublikos nacionalinio plėtros banko įstatyme.
        2. Licencines finansines paslaugas nustato Lietuvos Respublikos įstatymai arba Europos Sąjungos teisės aktai.
        3. Teikti licencines finansines paslaugas be licencijos yra draudžiama.
        4. Tik kredito įstaiga turi išimtinę teisę priimti indėlius ir kitas grąžintinas lėšas iš neprofesionalių rinkos dalyvių.
        5. Finansų įstaigos gali teikti finansines paslaugas užsienio valiuta, jeigu tai nustatyta Lietuvos Respublikos įstatymuose.
        6. Reglamento (ES) 2020/1503 1 straipsnio 3 dalyje nurodytais atvejais nereikalaujama kredito įstaigos ar kitų licencijų ir leidimų, susijusių su sutelktinio finansavimo paslaugų teikimu.
    entry:
      cites: 3 str. 3 d.
      title: >-
        Neteikti licencinių finansinių paslaugų be licencijos
      text: >-
        Asmeniui draudžiama teikti licencines finansines paslaugas neturint
        licencijos.
      addressee: finansines paslaugas teikiantis asmuo
      conditions: ""
      deadline: ""
      appliesTo: [all]
