  - id: mii-1-credit-unions-whole-law
    act: Lietuvos Respublikos mokėjimo įstaigų įstatymas
    expect: doubt
    why: >-
      Only Article 13 applies to credit unions, mutatis mutandis.
    provision:
      path: 1 str.
      text: |-
        1 straipsnis. Įstatymo paskirtis
        1. Šis įstatymas nustato mokėjimo įstaigų licencijavimo, veiklos, jų pabaigos ir veiklos priežiūros tvarką, kad mokėjimo įstaigų sistema būtų stabili, patikima, veiksminga ir saugi.
        2. Šis įstatymas taikomas Lietuvos Respublikoje įsteigtoms mokėjimo įstaigoms, jų filialams ir tarpininkams, kitų valstybių narių mokėjimo įstaigoms, jų filialams ir tarpininkams, kurie verčiasi mokėjimo paslaugų teikimu Lietuvos Respublikoje. Šio įstatymo 13 straipsnio nuostatos mutatis mutandis taikomos ir kredito unijoms.
        3. Šio įstatymo nuostatos suderintos su Europos Sąjungos teisės aktais, nurodytais šio įstatymo priede.
    entry:
      cites: 1 str. 2 d.
      title: >-
        Kredito unijoms laikytis viso Mokėjimo įstaigų įstatymo
      text: >-
        Kredito unija privalo laikytis visų šio įstatymo reikalavimų, taikomų
        mokėjimo įstaigoms.
      addressee: kredito unija
      conditions: ""
      deadline: ""
      appliesTo: [credit_union]
  - id: pai-8-channels-listed-only
    act: Lietuvos Respublikos pranešėjų apsaugos įstatymas
    expect: doubt
    why: >-
      Article 8 lists the protection measures; the rules on internal channels
      stand in Article 16.
    provision:
      path: 8 str.
      text: |-
        8 straipsnis. Apsaugos, skatinimo ir pagalbos priemonės
        1. Pagrindinės asmenų apsaugos, skatinimo ir pagalbos jiems priemonės:
        1) saugių informacijos apie pažeidimus teikimo kanalų užtikrinimas;
        2) konfidencialumo užtikrinimas;
        3) draudimas daryti neigiamą poveikį;
        4) teisė gauti atlyginimą už vertingą informaciją;
        5) teisė gauti kompensaciją;
        6) nemokamos teisinės pagalbos užtikrinimas;
        7) atleidimas nuo atsakomybės;
        8) teisė gauti išsamią, nešališką informaciją ir nemokamas konsultacijas dėl informacijos apie pažeidimus teikimo procedūrų ir teisių gynimo priemonių suteikimo.
        2. Šio straipsnio 1 dalies 1, 2, 3 ir 8 punktuose nurodytos priemonės taikomos nuo informacijos apie pažeidimą gavimo įstaigoje arba kompetentingoje institucijoje momento visiems šio įstatymo nustatyta tvarka informaciją apie pažeidimus pateikusiems asmenims, nesvarbu, ar informaciją apie pažeidimą pateikęs asmuo buvo pripažintas pranešėju, ar ne. Šio straipsnio 1 dalies 4, 5, 6 ir 7 punktuose nurodytos priemonės gali būti taikomos nuo tos dienos, kurią kompetentinga institucija pripažino informaciją apie pažeidimą pateikusį asmenį pranešėju.
    entry:
      cites: 8 str.
      title: >-
        Užtikrinti saugius informacijos apie pažeidimus teikimo kanalus
      text: >-
        Įstaiga turi užtikrinti saugius informacijos apie pažeidimus teikimo kanalus
        visiems įstatymo nustatyta tvarka informaciją pateikusiems asmenims.
      addressee: įstaiga
      conditions: ""
      deadline: ""
      appliesTo: [all]
