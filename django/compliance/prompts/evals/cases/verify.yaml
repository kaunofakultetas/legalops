  - id: fii-1-central-bank
    act: Lietuvos Respublikos finansų įstaigų įstatymas
    expect: doubt
    why: >-
      Paragraph 3 says the law does not apply to the Bank of Lithuania.
    provision:
      path: 1 str.
      text: |-
        1 straipsnis. Įstatymo paskirtis
        1. Šis Įstatymas nustato, kokios paslaugos yra laikomos finansinėmis paslaugomis, reikalavimus finansų įmonių ir kredito įstaigų, kurios verčiasi finansinių paslaugų teikimu, steigėjams, dalyviams bei vadovams, šių teises ir pareigas, finansų įstaigų steigimo, veiklos, jos pabaigos ir pertvarkymo sąlygas, tvarką bei ypatumus, taip pat finansų įstaigų, teikiančių licencines finansines paslaugas, veiklos priežiūros sąlygas, tvarką bei ypatumus.
        2. Šis Įstatymas taikomas visoms finansų įstaigoms – Lietuvos Respublikos juridiniams asmenims ir užsienio valstybių finansų įstaigų padaliniams, kurie veikia Lietuvos Respublikoje ir verčiasi finansinių paslaugų, nustatytų šio Įstatymo 3 straipsnyje, teikimu Lietuvos Respublikoje, jeigu Lietuvos Respublikos tarptautinės sutartys nenustato ko kita.
        3. Šis Įstatymas netaikomas:
        1) Lietuvos Respublikos valstybės ir savivaldybių institucijoms bei įstaigoms, kurios teikia finansines paslaugas, nustatytas Lietuvos Respublikos įstatymuose;
        2) pašto paslaugų teikėjams, kurie teikia vietines ir tarptautines pašto perlaidų paslaugas;
        3) Lietuvos bankui, teikiančiam finansines paslaugas Lietuvos Respublikos įstatymų nustatyta tvarka.
        4. Šiuo Įstatymu įgyvendinami Europos Sąjungos teisės aktai, nurodyti Įstatymo priede.
    entry:
      cites: 1 str.
      title: >-
        Laikytis Finansų įstaigų įstatymo teikiant finansines paslaugas
      text: >-
        Lietuvos bankas, teikdamas finansines paslaugas, privalo laikytis šio
        įstatymo reikalavimų.
      addressee: Lietuvos bankas
      conditions: ""
      deadline: ""
      appliesTo: [all]
  - id: kri-22-transition
    act: Lietuvos Respublikos kriptoturto rinkų įstatymas
    expect: supported
    why: >-
      Paragraph 3.
    provision:
      path: 22 str.
      text: |-
        22 straipsnis. Įstatymo įsigaliojimas, įgyvendinimas ir taikymas
        1. Šio įstatymo 7 ir 8 straipsniai įsigalioja 2024 m. rugpjūčio 1 d.
        2. Priežiūros institucija ir teisingumo ministras iki 2024 m. liepos 31 d. priima šio įstatymo įgyvendinamuosius teisės aktus, o dėl nuostatų, kurios taikomos nuo 2024 m. gruodžio 30 d., priima šio įstatymo įgyvendinamuosius teisės aktus iki 2024 m. gruodžio 29 d.
        3. Į Juridinių asmenų registro tvarkomą sąrašą įrašyti virtualiųjų valiutų keityklos operatoriai ir depozitinių virtualiųjų valiutų piniginių operatoriai nuo 2026 m. sausio 1 d. netenka teisės vykdyti virtualiųjų valiutų keityklų operatoriaus ir depozitinių virtualiųjų valiutų piniginių operatoriaus veiklos, jeigu jie nėra gavę licencijos Reglamento (ES) 2023/1114 ir šio įstatymo nustatyta tvarka.
        4. Šio įstatymo reikalavimai asmenims, viešai siūlantiems ar prašantiems įtraukti į prekybą kriptoturtą, kuris nėra su turtu susieti žetonai arba elektroninių pinigų žetonai, kriptoturto paslaugų teikėjams taikomi nuo 2024 m. gruodžio 30 d.
    entry:
      cites: 22 str. 3 d.
      title: >-
        Nevykdyti virtualiųjų valiutų operatoriaus veiklos be licencijos nuo 2026 m. sausio 1 d.
      text: >-
        Į Juridinių asmenų registro tvarkomą sąrašą įrašytas virtualiųjų valiutų
        keityklos operatorius ar depozitinių virtualiųjų valiutų piniginių
        operatorius nuo 2026 m. sausio 1 d. negali vykdyti šios veiklos, jeigu nėra
        gavęs licencijos pagal Reglamentą (ES) 2023/1114 ir šį įstatymą.
      addressee: į sąrašą įrašytas virtualiųjų valiutų keityklos ar piniginių operatorius
      conditions: "Operatorius nėra gavęs licencijos."
      deadline: "nuo 2026-01-01"
      appliesTo: [casp]
