slug: corpus.scope
name: Scope of an act
kind: corpus
description: >
  Reads the scope provisions of legal acts and names the kinds of institution
  each act's own text covers. A report leaves an act out for a company only
  when both the catalogue's hand-written list and this reading leave the
  company's kind out — a list ages with its act (the Law on Financial
  Institutions has counted crypto-asset services among financial services
  since 2024; its list never learned of it). Read once per act version, by
  the first report that would otherwise leave the act out.
variables: []
